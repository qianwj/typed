name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - collections
          - utils
          - control
          - reactivex
          - concurrency
          - adt
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # Start with a fresh cache after correcting the v0.0.3 checksums.
          cache: false

      - name: Use modules from this checkout
        run: go work init ./adt ./utils ./collections ./control ./reactivex ./concurrency

      - name: Run tests with coverage
        working-directory: ${{ matrix.module }}
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
          # Public repos on github.com do not need a token; the GitHub
          # App integration on codecov.io authenticates the upload.
          # If you later flip the repo to private, set the
          # CODECOV_TOKEN secret and uncomment the line below.
          # token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: false

  lint:
    name: lint / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - collections
          - utils
          - control
          - reactivex
          - concurrency
          - adt
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # Start with a fresh cache after correcting the v0.0.3 checksums.
          cache: false

      - name: Use modules from this checkout
        run: go work init ./adt ./utils ./collections ./control ./reactivex ./concurrency

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  coverage-aggregate:
    name: coverage / root
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          # Start with a fresh cache after correcting the v0.0.3 checksums.
          cache: false

      - name: Use modules from this checkout
        run: go work init ./adt ./utils ./collections ./control ./reactivex ./concurrency

      - name: Collect coverage across all modules
        run: |
          set -euo pipefail
          for module in utils collections control reactivex concurrency adt; do
            (cd "${module}" && \
              go test -race -count=1 \
                -coverprofile=coverage.out \
                -covermode=atomic \
                ./...)
          done

      - name: Upload combined coverage to Codecov (root flag)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            utils/coverage.out
            collections/coverage.out
            control/coverage.out
            reactivex/coverage.out
            concurrency/coverage.out
            adt/coverage.out
          flags: root
          fail_ci_if_error: false
          verbose: false
